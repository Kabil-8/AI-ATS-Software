version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: talentai-mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: talentai_ats
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentai-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/talentai_ats
      JWT_SECRET: talentai_enterprise_super_secret_jwt_2026
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - mongodb
      - ai-service

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: talentai-ai-service
    restart: always
    ports:
      - '8000:8000'
    environment:
      PORT: 8000
      BACKEND_URL: http://backend:5000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talentai-frontend
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  mongo_data:
