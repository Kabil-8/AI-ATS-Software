version: '3.8'

services:
  # ── MongoDB ─────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: ats_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai-ats
    networks:
      - ats_network

  # ── Backend (Node.js / Express) ──────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/ai-ats
      - AI_SERVICE_URL=http://ai-service:8000
      - NODE_ENV=production
    depends_on:
      - mongo
      - ai-service
    networks:
      - ats_network

  # ── AI Microservice (Python / FastAPI) ───────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ats_ai_service
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - ./ai-service/.env
    networks:
      - ats_network

  # ── Frontend (React / Vite) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ats_frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - ats_network

volumes:
  mongo_data:

networks:
  ats_network:
    driver: bridge
